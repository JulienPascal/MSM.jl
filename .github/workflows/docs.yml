name: Documentation

# Builds the documentation on pushes to every branch (so that work branches are checked before they
# are merged), on tags and on pull requests. It is only deployed (to the gh-pages branch) from main
# and from tags: deploydocs in docs/make.jl skips the other branches.
on:
  push:
  pull_request:
  workflow_dispatch:

# deploydocs pushes to gh-pages with the GitHub token; julia-actions/cache deletes old caches
permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        run: julia --project=docs/ docs/make.jl
