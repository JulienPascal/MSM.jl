name: CI

# Runs on pushes to every branch (so that work branches are tested before they are merged),
# on pull requests, and by hand from the Actions tab
on:
  push:
  pull_request:
  workflow_dispatch:

# julia-actions/cache needs to delete old caches
permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'   # long-term support release, and the minimum version required by MSM.jl
          - '1'      # latest release
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # Test coverage, sent to Codecov (the token is the CODECOV_TOKEN secret of the repository)
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
